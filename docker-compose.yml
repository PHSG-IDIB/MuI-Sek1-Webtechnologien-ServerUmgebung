services:

  # 1. Die Arbeitsumgebung für das BOLT-CMS
  bolt-web:
    build:
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - "8010:80"
    volumes:
      - ./server/bolt:/var/www/html

  # 4. Die Arbeitsumgebung für die einfache HTML-Seite.
  html-web:
    image: nginx:alpine
    ports:
      - "8020:80"
    volumes:
      - ./server/html/public:/usr/share/nginx/html
