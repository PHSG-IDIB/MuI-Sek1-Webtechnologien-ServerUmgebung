<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Meine Webseite</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Startseite</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">Über uns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="contact.html">Kontakt</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5 flex-grow-1">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h2 class="mb-4">Kontaktieren Sie uns</h2>
            <div class="card shadow-sm p-4">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Dein Name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-Mail Adresse</label>
                        <input type="email" class="form-control" id="email" placeholder="name@beispiel.ch">
                    </div>
                    <div class="mb-4">
                        <label for="message" class="form-label">Nachricht</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Wie können wir helfen?"></textarea>
                    </div>
                    <!-- Verschiedene Bootstrap-Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Nachricht senden</button>
                        <button type="reset" class="btn btn-outline-secondary">Formular leeren</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0">&copy; 2026 Meine Webseite. Alle Rechte vorbehalten.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
